# omarchy-multiuser: the greeter lists every user (full names) with an
# optional field for any other username, and nobody is logged in
# automatically. SDDM reads /etc/sddm.conf.d in name order and the last value
# wins, so this sorts after Omarchy's 10-theme.conf, 99-omarchy-login.conf and
# autologin.conf ('z' > 'a' > '9').
[Theme]
Current=omarchy-multiuser

[Users]
RememberLastUser=true
RememberLastSession=true
MinimumUid=1000
HideShells=/usr/bin/nologin,/sbin/nologin,/usr/bin/false,/bin/false

[Autologin]
User=
Session=
