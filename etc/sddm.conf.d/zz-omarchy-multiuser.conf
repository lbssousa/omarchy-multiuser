# omarchy-multiuser: the password-only login screen, and nobody logged in
# automatically unless omarchy-mu-login-select says so. SDDM reads /etc/sddm.conf.d
# in name order and the last value wins, so this sorts after Omarchy's 10-theme.conf,
# 99-omarchy-login.conf and autologin.conf, and before the zzz- drop-in that
# omarchy-mu-login-select writes for one boot.
[Theme]
Current=omarchy-multiuser

[Users]
RememberLastUser=true
RememberLastSession=true
ReuseSession=true
MinimumUid=1000
HideShells=/usr/bin/nologin,/sbin/nologin,/usr/bin/false,/bin/false

[Autologin]
User=
Session=
