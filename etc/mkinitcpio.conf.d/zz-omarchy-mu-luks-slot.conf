# Once accounts have their own key slots, the unlock records which one opened the
# disk (omarchy-mu-luks-slot, after encrypt), so omarchy-mu-login-select can open
# that person's desktop. Its own file, sorting after the others: an older hooks
# drop-in, or one edited by hand, sets HOOKS whole and would drop it. A systemd
# initramfs (sd-encrypt) has no encrypt hook and shows the login screen.
# Once Omarchy ships its own (omarchy-luks-slot, omarchy-login-select), only its
# wrapper goes in: two would stand in for cryptsetup one in front of the other.
if [[ -f ${OMU_SLOT_MAP_FILE:-/etc/omarchy-multiuser/slots} && " ${HOOKS[*]} " == *" encrypt "* &&
  " ${HOOKS[*]} " != *" omarchy-mu-luks-slot "* && " ${HOOKS[*]} " != *" omarchy-luks-slot "* &&
  ! -x ${OMU_UPSTREAM_BIN:-/usr/bin}/omarchy-login-select ]]; then
  _omu_hooks=()
  for _omu_hook in "${HOOKS[@]}"; do
    _omu_hooks+=("$_omu_hook")
    [[ $_omu_hook == "encrypt" ]] && _omu_hooks+=(omarchy-mu-luks-slot)
  done
  HOOKS=("${_omu_hooks[@]}")
  unset _omu_hooks _omu_hook
fi
