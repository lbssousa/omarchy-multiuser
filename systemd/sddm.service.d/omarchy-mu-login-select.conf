# Decide at every SDDM start, not once at boot, whose desktop it opens. The first
# step takes any automatic login away and must succeed, or SDDM doesn't start into
# someone else's desktop; the second names the one account, or the one whose key
# slot unlocked the disk this boot, and may fail into the login screen.
[Service]
ExecStartPre=/usr/bin/omarchy-mu-login-select --clear
ExecStartPre=-/usr/bin/omarchy-mu-login-select
