[General]
# Defaults: Omarchy's stock greeter (Tokyo Night). omarchy-mu-sddm-sync
# writes theme.conf.user next to this file with the colors that
# omarchy-plymouth-set (Appearance > Unlock) last gave the stock theme.
background=#1a1b26
textColor=#c0caf5
# Images (logo, entry, lock, bullet) are read from the stock theme, which
# omarchy-plymouth-set recolors; fallback/ holds the original copies.
assetDir=/usr/share/sddm/themes/omarchy/
# Offer an "Other user…" row that reveals a username field.
allowOtherUser=true
# Show the username under the full name when they differ.
showUsername=true
# Rows visible before the list scrolls.
maxVisibleUsers=6
