# Machine-wide locks for omarchy-multiuser (omu_hold_lock). Readable by
# administrators only: they open them read-only to flock, so nobody can
# create them under their own name and keep the others out.
f /run/lock/omarchy-mu-accounts.lock 0640 root wheel -
f /run/lock/omarchy-mu-update.lock 0640 root wheel -
